services:
  - type: web
    name: lab-scraper-api
    env: python
    region: oregon
    plan: free
    
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: lab_scraper_db
          property: connectionString

  - type: cron
    name: daily-batch-scraper
    schedule: "30 18 * * *"
    startCommand: bash trigger_batch.sh

databases:
  - name: lab_scraper_db
    databaseName: lab_scraper_db
    plan: free
    region: oregon
